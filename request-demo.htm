<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTTP Request - StudySprint</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2 class="logo">StudySprint</h2>

    <a href="homepage.htm">
        Dashboard
    </a>

    <a href="data.htm">
        Planner
    </a>

    <a href="other.htm">
        Pomodoro
    </a>

</nav>


<div class="container">

    <div class="page-heading">

        <h1>HTTP Request Demo</h1>

        <p class="subtitle">
            Send information using a web request.
        </p>

    </div>


    <div class="card">

        <h2>Send Study Information</h2>

        <br>

        <form onsubmit="sendRequest(event)">

            <label>
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                required
            >

            <br>
            <br>

            <label>
                Subject
            </label>

            <input
                type="text"
                id="requestSubject"
                required
            >

            <br>
            <br>

            <input
                type="submit"
                value="Send Request"
            >

        </form>

    </div>


    <div class="card">

        <h2>Server Response</h2>

        <p id="response">
            No request sent.
        </p>

    </div>

</div>


<script>

function sendRequest(event) {

    event.preventDefault();

    let name =
        document.getElementById("studentName").value;

    let subject =
        document.getElementById("requestSubject").value;


    let data = {

        name: name,

        subject: subject

    };


    fetch("https://httpbin.org/post", {

        method: "POST",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify(data)

    })

    .then(response => response.json())

    .then(result => {

        document.getElementById("response").innerHTML =

            "Request successfully sent!<br><br>" +

            "<b>Name:</b> " +
            result.json.name +

            "<br>" +

            "<b>Subject:</b> " +
            result.json.subject;

    })

    .catch(error => {

        document.getElementById("response").innerHTML =

            "There was an error sending the request.";

    });

}

</script>

</body>

</html>
