```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - StudySprint</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-page">

    <div class="login-form-area">

        <div class="login-form">

            <h1>StudySprint</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <br>

            <form onsubmit="loginUser(event)">


                <!-- NAME -->

                <label>
                    Name
                </label>

                <br>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <br><br>


                <!-- EMAIL -->

                <label>
                    Email
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <br><br>


                <!-- PASSWORD -->

                <label>
                    Password
                </label>

                <br>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >


                <br><br>


                <input
                    type="submit"
                    value="Log In"
                >

            </form>

        </div>

    </div>

</div>


<script>

function loginUser(event) {

    event.preventDefault();


    // Get the name entered by the user

    let name =
        document.getElementById("name").value;


    // Send the name to the dashboard

    window.location.href =
        "homepage.htm?name=" + encodeURIComponent(name);

}

</script>


</body>

</html>
```
