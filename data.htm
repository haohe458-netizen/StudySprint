<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudySprint Planner</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav>

    <h2 class="logo">StudySprint</h2>

    <a href="homepage.htm">
        Dashboard
    </a>

    <a href="data.htm" class="active">
        Planner
    </a>

    <a href="other.htm">
        Pomodoro
    </a>

</nav>


<div class="container">


    <div class="page-heading">

        <h1>Study Planner</h1>

        <p class="subtitle">
            Add and manage your homework.
        </p>

    </div>


    <!-- ADD HOMEWORK -->

    <div class="card form-card">

        <h2>Add Homework</h2>


        <form onsubmit="addHomework(event)">


            <label>
                Subject
            </label>


            <select id="subject" required>

                <option value="">
                    Select a subject
                </option>

                <option>
                    Maths
                </option>

                <option>
                    English
                </option>

                <option>
                    Science
                </option>

                <option>
                    Computer Science
                </option>

                <option>
                    Geography
                </option>

            </select>


            <label>
                Homework
            </label>


            <input
                type="text"
                id="task"
                placeholder="e.g. Integration worksheet"
                required
            >


            <label>
                Due Date
            </label>


            <input
                type="date"
                id="dueDate"
                required
            >


            <label>
                Priority
            </label>


            <select id="priority">

                <option>
                    Low
                </option>

                <option>
                    Medium
                </option>

                <option>
                    High
                </option>

            </select>


            <br>
            <br>


            <input
                type="submit"
                value="Add Homework"
            >


        </form>

    </div>


    <br>


    <!-- RESULT -->

    <div class="card">

        <h2>Homework Added</h2>

        <div id="message">

            No new homework added.

        </div>

    </div>


</div>


<script src="script.js"></script>


</body>

</html>
